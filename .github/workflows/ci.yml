name: CI

# Builds the pip wheel on every push so a broken package is caught here and
# not at release time. The wheel is abi3-py39 (see Cargo.toml), so one build
# covers every supported interpreter — the test matrix below proves it by
# installing that single artifact on the oldest and newest Python we claim.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked keeps CI honest about Cargo.lock, matching scripts/release.sh.
      - run: cargo test --locked
      # Not a gate yet: clippy has never run on this crate, so turn this into a
      # blocking step only once the existing warnings are cleared.
      - run: cargo clippy --all-targets --locked
        continue-on-error: true

  wheel:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # manylinux2014 mirrors [tool.maturin] compatibility in pyproject.toml.
          # Building outside the manylinux container links against the runner's
          # newer glibc and the wheel is then rejected as non-compliant.
          manylinux: manylinux2014
          args: --release --locked --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  pytest:
    name: pytest (py${{ matrix.python }})
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest of the requires-python >=3.9 range. If the abi3
        # promise ever breaks, it breaks at one of these two ends.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install the built wheel and run the suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest
      - name: Smoke-test the CLI entry point
        run: donglao-g2p --help
