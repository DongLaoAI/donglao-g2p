[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "donglao-g2p"
version = "0.2.0"
description = "Fast Vietnamese-English text normalization and grapheme-to-phoneme conversion"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DongLao" }]
keywords = ["g2p", "phonemizer", "vietnamese", "tts", "text-normalization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "maturin>=1.7,<2",
  "pytest>=8,<9",
]

[project.scripts]
donglao-g2p = "donglao_g2p.cli:main"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "donglao_g2p._native"
python-source = "python"
compatibility = "manylinux2014"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
